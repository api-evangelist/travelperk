aid: travelperk
url: https://raw.githubusercontent.com/api-evangelist/travelperk/refs/heads/main/apis.yml
name: TravelPerk
kind: company
description: TravelPerk is a business-travel management platform that lets companies
  book and manage flights, hotels, trains, and cars in one place. Its Open API gives
  partners and customers programmatic access to bookings and trips, invoices and
  expenses, travelers and members, cost centers, scheduled reports, and webhooks
  for real-time travel and finance data exchange with HR systems, ERPs, and
  expense tools.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Business Travel
- Travel Management
- Expenses
- Invoices
- Bookings
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
